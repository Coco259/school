<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>统计分析 - 学生成绩管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/index">学生成绩管理系统</a>
            <button id="logoutBtn" class="btn btn-light">退出登录</button>
        </div>
    </nav>
    <div class="container py-4" id="statisticsPage">
        <h3 class="mb-4">统计分析</h3>
        <div class="row g-4">
            <div class="col-lg-6">
                <div class="card h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>班级统计</span>
                        <select id="classSelect" class="form-select form-select-sm w-auto"></select>
                    </div>
                    <div class="card-body">
                        <div id="classSummary" class="row text-center mb-3 gy-2"></div>
                        <canvas id="classDistributionChart" height="220"></canvas>
                        <canvas id="classRankingChart" class="mt-3" height="220"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>课程统计</span>
                        <select id="courseSelect" class="form-select form-select-sm w-auto"></select>
                    </div>
                    <div class="card-body">
                        <div id="courseSummary" class="row text-center mb-3 gy-2"></div>
                        <canvas id="courseDistributionChart" height="220"></canvas>
                        <div class="mt-3">
                            <h6>成绩前十</h6>
                            <div class="table-responsive">
                                <table class="table table-sm">
                                    <thead>
                                        <tr>
                                            <th>排名</th>
                                            <th>学生</th>
                                            <th>成绩</th>
                                        </tr>
                                    </thead>
                                    <tbody id="courseTopTable"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="position-fixed top-0 end-0 p-3" style="z-index: 1080">
        <div id="toastContainer" class="toast-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/main.js"></script>
    <script src="/static/js/statistics.js"></script>
</body>
</html>
