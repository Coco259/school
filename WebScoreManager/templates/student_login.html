<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>学生登录 - 学生成绩管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-primary text-white text-center">
                        <h3>学生登录</h3>
                    </div>
                    <div class="card-body">
                        <form id="studentLoginForm">
                            <div class="mb-3">
                                <label for="student_id" class="form-label">学号</label>
                                <input type="number" class="form-control" id="student_id" name="student_id" required data-rules="required|positiveInteger" data-label="学号">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">密码（如有）</label>
                                <input type="password" class="form-control" id="password" name="password" data-label="密码">
                            </div>
                            <button type="submit" class="btn btn-primary w-100" data-loading-text="登录中">登录</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/student.js"></script>
</body>
</html>
