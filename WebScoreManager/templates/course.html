<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>课程管理 - 学生成绩管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/index">学生成绩管理系统</a>
            <button id="logoutBtn" class="btn btn-light">退出登录</button>
        </div>
    </nav>
    <div class="container mt-4" id="coursePage">
        <h3>课程管理</h3>
        <form id="addCourseForm" class="mb-4">
            <div class="row g-3">
                <div class="col-md-4">
                    <input type="text" name="course_name" class="form-control" placeholder="课程名称" required data-rules="required" data-label="课程名称">
                </div>
                <div class="col-md-4">
                    <input type="text" name="teacher" class="form-control" placeholder="授课教师" required data-rules="required" data-label="授课教师">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-success" data-loading-text="提交中">添加课程</button>
                </div>
            </div>
        </form>
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>课程ID</th>
                    <th>课程名称</th>
                    <th>授课教师</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="courseTableBody"></tbody>
        </table>
    </div>
        <!-- 编辑课程模态框 -->
        <div class="modal fade" id="editCourseModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">编辑课程</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="editCourseForm">
                            <input type="hidden" id="editCourseId">
                            <div class="mb-3">
                                <input type="text" id="editCourseName" class="form-control" placeholder="课程名称" required data-rules="required" data-label="课程名称">
                            </div>
                            <div class="mb-3">
                                <input type="text" id="editTeacher" class="form-control" placeholder="授课教师" required data-rules="required" data-label="授课教师">
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-primary" onclick="saveEditCourse()" data-loading-text="保存中">保存</button>
                    </div>
                </div>
            </div>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/main.js"></script>
    <script src="/static/js/course.js"></script>
</body>
</html>
