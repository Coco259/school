<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>首页 - 学生成绩管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/index">学生成绩管理系统</a>
            <button id="logoutBtn" class="btn btn-light">退出登录</button>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4">
                <a href="/student" class="text-decoration-none">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5 class="card-title">学生管理</h5>
                            <p class="card-text">添加、查询、编辑学生信息</p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-4">
                <a href="/course" class="text-decoration-none">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5 class="card-title">课程管理</h5>
                            <p class="card-text">管理课程信息</p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-4">
                <a href="/score" class="text-decoration-none">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5 class="card-title">成绩管理</h5>
                            <p class="card-text">录入、查询学生成绩</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>

</html>
